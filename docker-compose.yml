services:
  # Local PostgreSQL with pgvector for testing & local development
  postgres:
    image: pgvector/pgvector:pg16
    container_name: slack_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: slackbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d slackbot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Slack AI Agent Application
  slack-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: slack_ai_agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Use DATABASE_URL from .env if provided; defaults to local container only if unset
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/slackbot}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
    volumes:
      # Mount Google OAuth files if using file-based auth
      - ./token.json:/app/token.json:rw
      - ./credentials.json:/app/credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local
