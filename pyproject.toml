[project]
name = "slack"
version = "0.1.0"
description = "Modular Slack AI Agent with Google Calendar, Gmail, and Keep Integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "gkeepapi>=0.14.4",
    "google-api-python-client>=2.160.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
    "langchain>=1.4.1",
    "langchain-groq>=1.1.3",
    "pydantic-settings>=2.8.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "uvicorn>=0.53.0",
]
